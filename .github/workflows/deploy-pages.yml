name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # The point cloud itself is not committed (data stays with its owner,
      # IFP); CI downloads it from the source and rebuilds the viewer binary,
      # so every deploy is reproducible from the scripts alone.
      - name: Download and process the point cloud
        run: |
          python scripts/download_data.py
          python scripts/process_data.py --max-points 1500000

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: viz

      - id: deployment
        uses: actions/deploy-pages@v4
